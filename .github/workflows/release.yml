name: Release

# Cuando cambia VERSION en main se crea la etiqueta vX.Y.Z y la release de
# GitHub con la sección de esa versión en CHANGELOG.md. También crea las
# releases de .github/releases-anteriores.txt que todavía no existan.
on:
  push:
    branches: [main]
    paths: [VERSION, .github/releases-anteriores.txt]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Etiqueta y release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Función para leer las notas del changelog
        run: |
          cat > notas.sh <<'SH'
          # Uso: notas.sh X.Y.Z > archivo. Sale con error si no hay sección.
          awk -v v="$1" '
            index($0, "## " v " ") == 1 { dentro = 1; next }
            dentro && /^## / { exit }
            dentro { print }
          ' CHANGELOG.md | tee /tmp/notas.md
          test -s /tmp/notas.md || { echo "::error::CHANGELOG.md no tiene la sección '## $1'." >&2; exit 1; }
          SH
          chmod +x notas.sh
      - name: Releases anteriores
        run: |
          grep -v '^#' .github/releases-anteriores.txt | while read -r version commit; do
            [ -n "$version" ] || continue
            if gh release view "v$version" > /dev/null 2>&1; then continue; fi
            ./notas.sh "$version" > notas.md
            gh release create "v$version" --target "$commit" --title "v$version" --notes-file notas.md --latest=false
          done
      - name: Release de la versión actual
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "La release v$version ya existe."
            exit 0
          fi
          ./notas.sh "$version" > notas.md
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes-file notas.md --latest
