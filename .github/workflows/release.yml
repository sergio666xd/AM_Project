name: Release

# Cuando cambia VERSION en main se crea la etiqueta vX.Y.Z y la release de
# GitHub con la sección de esa versión en CHANGELOG.md. También crea las
# releases de las versiones publicadas antes de esta acción que todavía no existan.
on:
  push:
    branches: [main]
    paths: [VERSION, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Etiqueta y release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Función para leer las notas del changelog
        run: |
          cat > notas.sh <<'SH'
          # Uso: notas.sh X.Y.Z > archivo. Sale con error si no hay sección.
          awk -v v="$1" '
            index($0, "## " v " ") == 1 { dentro = 1; next }
            dentro && /^## / { exit }
            dentro { print }
          ' CHANGELOG.md | tee /tmp/notas.md
          test -s /tmp/notas.md || { echo "::error::CHANGELOG.md no tiene la sección '## $1'." >&2; exit 1; }
          SH
          chmod +x notas.sh
      - name: Releases anteriores
        run: |
          # Versión y commit de main donde salió cada una (PR #2, #13, #20, #36, #50, #55, #59, #60 y #65).
          while read -r version commit; do
            if gh release view "v$version" > /dev/null 2>&1; then continue; fi
            ./notas.sh "$version" > notas.md
            gh release create "v$version" --target "$commit" --title "v$version" --notes-file notas.md --latest=false
          done <<'LISTA'
          1.0.0 ff75847c8b382a0a62c229a3bc8cb949900e4f16
          1.1.0 c3698f38c4a2318054f87bfed07fd83dfd18f4c0
          1.2.0 49e53a9a89ff724d328a50e392a7747a54903014
          1.3.0 8da4cfdcd9a4df486ef85e60a1450677c92c164b
          2.0.0 6106044cdc339f7a85b96ed9b29e10978e6f2b2c
          2.1.0 df3201c3c56a1da80e426e44d3423d74f4074f74
          2.2.0 1448b2f128353da4e9f55a7f0e3027851e014183
          2.2.1 9653e92aec1b935e8b530036bb4f64f222e98ca2
          2.3.0 4674813af512db8b1816d1fbd13a44ca42b5e0bd
          LISTA
      - name: Release de la versión actual
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "La release v$version ya existe."
            exit 0
          fi
          ./notas.sh "$version" > notas.md
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes-file notas.md --latest
