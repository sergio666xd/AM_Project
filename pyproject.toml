[project]
name = "gestion-procesos-saas"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic>=1.13,<2",
    "psycopg[binary]",
    "pydantic>=2.12,<3",
    "pydantic-settings",
    "email-validator",
    "python-dotenv",
    "python-multipart",
    "passlib[bcrypt]",
    "bcrypt==4.0.1",
    "python-jose[cryptography]",
    "cryptography",
    "requests",
    "pywebpush>=2.0,<3",
    "boto3",
    "pypdf>=6.0,<7",
    "pypdfium2>=4.30,<5",
    "reportlab>=4.3,<5",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["frontend-saas", "graphify-out", "venv"]

[tool.ruff.lint]
# Solo errores reales: nombres sin definir, imports y variables sin uso.
# El estilo del código no se impone.
select = ["F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Permite ejecutar `pytest` directamente (no solo `python -m pytest`) e importar `app`.
pythonpath = ["."]
